<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>ACV Gym</title>
	<link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
   
</head>
<body>
    <header>
        <nav class="navbar">
               <a class="logo" href="image/acvgymlogo.png" target="_blank"><img src="image/acvgymlogo.png" alt="ACV Gym" width="150px" height="150px"></a> 
            <ul class="menu-links">
                <span id="close-menu-btn" class="material-symbols-outlined">close</span>
                <li><a href="#">Home</a></li>
                <li><a href="#">Services</a></li>
                <li><a href="#">Testimonials</a></li>
                <li><a href="#">About us</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
            <span id="hamburger-btn" class="material-symbols-outlined">menu</span>
        </nav>
    </header>
    <section class="hero-section">
        <div class="content">
           <h2>Ready to get Stronger?</h2>
           <h3>You dont get what you wish for! You get it what you work for!</h3>
           <p>Register now to get 7 days free access.</p>
            <button>Register Now</button>
        </div>
    </section>
    <footer>
        <div class="foot">
          <p> Copyright &copy; 2025 ACV Gym Cabuyao Laguna  All rights reserved</p> 
          <p> Owner: Nonie Virtucio</p>
        </div>
    </footer>
     
    
   <script>
      const header = document.querySelector("header");
      const hamburgerBtn = document.querySelector("#hamburger-btn");
      const closeMenuBtn = document.querySelector("#close-menu-btn");

      // Toggle mobile menu on hamburger button click
      hamburgerBtn.addEventListener("click", () => header.classList.toggle("show-mobile-menu"));

      // Close mobile menu on close button click
      closeMenuBtn.addEventListener("click", () => hamburgerBtn.click());
    </script>
   
</body>
</html>
